<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:   #080808;
    --fg:   #ffffff;
    --fg-2: #888888;
    --fg-3: #555555;
    --line: #1f1f1f;
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans:  'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{
    height:100%;
    background:transparent;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    cursor:default;
  }
  body{
    font-family:var(--sans);
    color:var(--fg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex; align-items:center; justify-content:center;
    animation: shellIn .35s ease-out both;
  }
  body.fadeout{ animation: shellOut .32s ease-in forwards; }

  .card{
    width:100%; height:100%;
    background:var(--bg);
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 20px 60px -10px rgba(0,0,0,0.55);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:36px;
    position:relative;
    overflow:hidden;
  }

  /* subtle ambient glow */
  .card::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(420px 220px at 50% 30%, rgba(255,255,255,0.035), transparent 60%),
      radial-gradient(280px 200px at 50% 100%, rgba(255,255,255,0.02), transparent 70%);
  }

  .brand-stack{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    position:relative; z-index:1;
  }
  .brand{
    font-family:var(--serif);
    font-weight:500;
    font-size:32px;
    letter-spacing:0.38em;
    text-transform:uppercase;
    color:var(--fg);
    padding-left:0.38em; /* compensate letter-spacing for visual centering */
    animation: textRise .55s cubic-bezier(0.2,0.7,0.2,1) both;
  }
  .divider{
    width:42px; height:1px; background:var(--line);
    animation: lineGrow .6s cubic-bezier(0.2,0.7,0.2,1) .1s both;
    transform-origin:center;
  }
  .tag{
    font-family:var(--sans);
    font-size:9px; font-weight:500;
    letter-spacing:0.34em; text-transform:uppercase;
    color:var(--fg-3);
    animation: textRise .55s cubic-bezier(0.2,0.7,0.2,1) .12s both;
  }

  .dots{
    display:flex; gap:12px;
    position:relative; z-index:1;
    animation: textRise .55s cubic-bezier(0.2,0.7,0.2,1) .2s both;
  }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background:var(--fg);
    opacity:0.22;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay:.18s; }
  .dots span:nth-child(3){ animation-delay:.36s; }
  .dots span:nth-child(4){ animation-delay:.54s; }

  @keyframes pulse{
    0%, 100% { opacity:.2; transform:scale(.82); }
    50%      { opacity:1;  transform:scale(1);   }
  }
  @keyframes shellIn{
    from{ opacity:0; transform:scale(.985); }
    to  { opacity:1; transform:scale(1); }
  }
  @keyframes shellOut{
    to{ opacity:0; transform:scale(.99); }
  }
  @keyframes textRise{
    from{ opacity:0; transform:translateY(6px); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes lineGrow{
    from{ opacity:0; transform:scaleX(0); }
    to  { opacity:1; transform:scaleX(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-stack">
      <div class="brand">Pomodoro</div>
      <div class="divider"></div>
      <div class="tag">Focus, refined</div>
    </div>
    <div class="dots">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
